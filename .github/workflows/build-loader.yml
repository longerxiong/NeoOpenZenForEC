name: Build Loader

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-loader:
    name: Build Windows loader
    runs-on: windows-2022
    timeout-minutes: 180

    env:
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\vcpkg-archives,readwrite

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: vcpkg-archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('native/vcpkg.json') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ hashFiles('native/vcpkg.json') }}-

      - name: Set up vcpkg
        shell: pwsh
        run: |
          $vcpkgRoot = Join-Path $env:GITHUB_WORKSPACE '.vcpkg'
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\vcpkg-archives" | Out-Null
          git clone --depth 1 --branch 2026.04.27 https://github.com/microsoft/vcpkg.git $vcpkgRoot
          & "$vcpkgRoot\bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg bootstrap failed with exit code $LASTEXITCODE"
          }
          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build loader
        shell: pwsh
        run: .\gradlew.bat --no-daemon dll

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openzen-windows-${{ github.sha }}
          path: |
            build/libs/openzen-1.0.0.jar
            build/rename-mapping.txt
            build/dist/OpenZenLoader.exe
          if-no-files-found: error
          retention-days: 30
